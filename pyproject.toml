[project]
name = "BGITU_Hardware_Management"
version = "0.1.0"
description = "A WEB service for managing the health of university hardware"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "alembic>=1.17.2",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "celery[redis]>=5.6.2",
    "cryptography>=49.0.0",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.139.0",
    "inflection>=0.5.1",
    "loguru>=0.7.3",
    "minio>=7.2.20",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "redis>=6.4.0",
    "sqlalchemy>=2.0.45",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]
