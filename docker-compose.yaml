services:
  db:
    image: postgres:17-alpine
    container_name: postgres_db
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      - POSTGRES_USER=${BGITU__DB__USERNAME}
      - POSTGRES_PASSWORD=${BGITU__DB__PASSWORD}
      - POSTGRES_DB=${BGITU__DB__DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: .
    container_name: fastapi_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
      echo 'Waiting for database...' &&
      until pg_isready -h db -p 5432 -U ${BGITU__DB__USERNAME}; do sleep 2; done &&
      echo 'Running migrations...' &&
      alembic upgrade head &&
      echo 'Seeding...' &&
      cd /backend && python -m core.seed &&
      echo 'Starting server...' &&
      uvicorn main:app --host 0.0.0.0 --port 8000
      "

  frontend:
    build: E:\University\JS\frontend_computers
    ports:
      - "8080:80"
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    container_name: diplom_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  redis_gui:
    image: redis/redisinsight
    ports:
      - "5540:5540"

  celery_worker:
    build: .
    container_name: diplom_celery_worker
    command: celery -A celery_app:celery_app worker -l info
    env_file:
      - .env.docker
    depends_on:
      - redis
    restart: unless-stopped

  celery_beat:
    build: .
    container_name: diplom_celery_beat
    command: celery -A celery_app:celery_app beat -l info
    env_file:
      - .env.docker
    depends_on:
      - redis
    restart: unless-stopped

  telegram_bot:
    build: .
    container_name: diplom_telegram_bot
    command: python -m telegram_bot.main
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - telegram

volumes:
  postgres_data:
