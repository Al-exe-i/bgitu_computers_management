x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-db-pool: &app-db-pool
  BGITU__DB__POOL_SIZE: "5"
  BGITU__DB__MAX_OVERFLOW: "5"

services:
  db:
    image: postgres:17-alpine
    container_name: postgres_db
    restart: unless-stopped
    cpus: "0.35"
    mem_limit: 384m
    memswap_limit: 384m
    pids_limit: 128
    logging: *default-logging
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=30
      - -c
      - work_mem=4MB
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${BGITU__DB__USERNAME}
      - POSTGRES_PASSWORD=${BGITU__DB__PASSWORD}
      - POSTGRES_DB=${BGITU__DB__DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: .
    container_name: fastapi_backend
    restart: unless-stopped
    cpus: "0.45"
    mem_limit: 320m
    memswap_limit: 320m
    pids_limit: 256
    logging: *default-logging
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      <<: *app-db-pool
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
      echo 'Waiting for database...' &&
      until pg_isready -h db -p 5432 -U ${BGITU__DB__USERNAME}; do sleep 2; done &&
      echo 'Running migrations...' &&
      alembic upgrade head &&
      echo 'Seeding...' &&
      cd /backend && python -m core.seed &&
      echo 'Starting server...' &&
      uvicorn main:app --host 0.0.0.0 --port 8000
      "

  frontend:
    build: ./frontend
    cpus: "0.15"
    mem_limit: 96m
    memswap_limit: 96m
    pids_limit: 128
    logging: *default-logging
    ports:
      - "8080:80"
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    container_name: diplom_redis
    cpus: "0.10"
    mem_limit: 64m
    memswap_limit: 64m
    pids_limit: 64
    logging: *default-logging
    ports:
      - "6379:6379"
    restart: unless-stopped

  redis_gui:
    image: redis/redisinsight
    cpus: "0.15"
    mem_limit: 96m
    memswap_limit: 96m
    pids_limit: 128
    logging: *default-logging
    ports:
      - "5540:5540"

  celery_worker:
    build: .
    container_name: diplom_celery_worker
    command: celery -A celery_app:celery_app worker -l info --concurrency=1 --prefetch-multiplier=1
    cpus: "0.35"
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 256
    logging: *default-logging
    env_file:
      - .env
    environment:
      <<: *app-db-pool
    depends_on:
      - redis
    restart: unless-stopped

  celery_beat:
    build: .
    container_name: diplom_celery_beat
    command: celery -A celery_app:celery_app beat -l info
    cpus: "0.10"
    mem_limit: 96m
    memswap_limit: 96m
    pids_limit: 128
    logging: *default-logging
    env_file:
      - .env
    environment:
      <<: *app-db-pool
    depends_on:
      - redis
    restart: unless-stopped

  telegram_bot:
    build: .
    container_name: diplom_telegram_bot
    command: python -m telegram_bot.main
    cpus: "0.15"
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 128
    logging: *default-logging
    env_file:
      - .env
    environment:
      <<: *app-db-pool
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: diplom_prometheus
    restart: unless-stopped
    cpus: "0.20"
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 128
    logging: *default-logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=6h
      - --storage.tsdb.retention.size=128MB
      - --web.enable-lifecycle
    volumes:
      - ./deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend

  loki:
    image: grafana/loki:3.3.2
    container_name: diplom_loki
    restart: unless-stopped
    cpus: "0.20"
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 128
    logging: *default-logging
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./deploy/observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:3.3.2
    container_name: diplom_promtail
    restart: unless-stopped
    cpus: "0.10"
    mem_limit: 64m
    memswap_limit: 64m
    pids_limit: 128
    logging: *default-logging
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./deploy/observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.3.1
    container_name: diplom_grafana
    restart: unless-stopped
    cpus: "0.25"
    mem_limit: 192m
    memswap_limit: 192m
    pids_limit: 256
    logging: *default-logging
    env_file:
      - .env
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  default:
    name: diplom_default
