x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-db-pool: &app-db-pool
  BGITU__DB__POOL_SIZE: "5"
  BGITU__DB__MAX_OVERFLOW: "5"
  BGITU__CACHE__REDIS_URL: "redis://redis:6379/3"
  BGITU__CACHE__USER_TTL_SECONDS: "600"
  BGITU__CACHE__OFFICE_SHORT_TTL_SECONDS: "300"
  BGITU__CACHE__ANALYTICS_FILTER_OPTIONS_TTL_SECONDS: "300"
  BGITU__STORAGE__BACKEND: "minio"
  BGITU__STORAGE__ENDPOINT: "minio:9000"

services:
  db:
    image: postgres:17-alpine
    container_name: postgres_db
    restart: unless-stopped
    cpus: "0.35"
    mem_limit: 384m
    memswap_limit: 384m
    pids_limit: 128
    logging: *default-logging
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=30
      - -c
      - work_mem=4MB
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${BGITU__DB__USERNAME}
      - POSTGRES_PASSWORD=${BGITU__DB__PASSWORD}
      - POSTGRES_DB=${BGITU__DB__DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: .
    container_name: fastapi_backend
    restart: unless-stopped
    cpus: "0.45"
    mem_limit: 320m
    memswap_limit: 320m
    pids_limit: 256
    logging: *default-logging
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      <<: *app-db-pool
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    command: >
      sh -c " echo 'Waiting for database...' && until pg_isready -h db -p 5432 -U ${BGITU__DB__USERNAME}; do sleep 2; done && echo 'Running migrations...' && alembic upgrade head && echo 'Seeding...' && cd /backend && python -m core.seed && echo 'Starting server...' && uvicorn main:app --host 0.0.0.0 --port 8000 "

  frontend:
    build: ./frontend
    cpus: "0.35"
    mem_limit: 256m
    memswap_limit: 512m
    pids_limit: 256
    logging: *default-logging
    ports:
      - "8080:80"
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    container_name: diplom_redis
    cpus: "0.20"
    mem_limit: 128m
    memswap_limit: 256m
    pids_limit: 64
    logging: *default-logging
    ports:
      - "6379:6379"
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: diplom_minio
    restart: unless-stopped
    cpus: "0.20"
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 128
    logging: *default-logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${BGITU__STORAGE__ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${BGITU__STORAGE__SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9005:9000"
      - "9006:9001"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  celery_worker:
    build: .
    container_name: diplom_celery_worker
    command: celery -A celery_app:celery_app worker -l info --concurrency=1
    cpus: "0.35"
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 256
    logging: *default-logging
    env_file:
      - .env
    environment:
      <<: *app-db-pool
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  celery_beat:
    build: .
    container_name: diplom_celery_beat
    command: celery -A celery_app:celery_app beat -l info
    cpus: "0.10"
    mem_limit: 96m
    memswap_limit: 96m
    pids_limit: 128
    logging: *default-logging
    env_file:
      - .env
    environment:
      <<: *app-db-pool
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:

networks:
  default:
    name: diplom_default
